[project]
name = "celine-jupyter"
version = "0.1.0"
description = "CELINE Jupyter server: platform administrators only (JWT identity provider and authorizer)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # `is_platform_admin` (realm role platform-admin) arrived in 2.0.0.
    "celine-sdk>=2.0.0",
    # allow_unauthenticated_access and @allow_unauthenticated arrived in 2.13.
    "jupyter-server>=2.13.0",
    # [crypto]: RS256 verification needs cryptography.
    "pyjwt[crypto]>=2.10.1",
    "requests>=2.32.5",
    # [all] preserves today's environment exactly. celine-utils 2.0 put the
    # pipeline and admin stacks behind extras; this package imports nothing
    # from celine.utils statically, but notebooks are not statically
    # discoverable, so the environment is kept whole rather than narrowed on
    # the strength of a grep.
    "celine-utils[all]>=2.0.0",
]

[project.scripts]
# `jupyter celine-server`, the image's command.
jupyter-celine-server = "celine.jupyter.serverapp:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/celine"]

[tool.hatch.build.targets.sdist]
include = ["src/celine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the local Keycloak (real tokens); skipped when it is unreachable",
]

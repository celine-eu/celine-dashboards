[project]
name = "celine-jupyter"
version = "0.1.0"
description = "CELINE Jupyter JWT authorizer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyjwt>=2.13.0",
    "requests>=2.32.5",
    # [all] preserves today's environment exactly. celine-utils 2.0 put the
    # pipeline and admin stacks behind extras; this package imports nothing
    # from celine.utils statically, but notebooks are not statically
    # discoverable, so the environment is kept whole rather than narrowed on
    # the strength of a grep.
    "celine-utils[all]>=2.0.0",
]

[dependency-groups]
dev = [
    "jupyter-server>=2.0.0",
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/celine"]

[tool.hatch.build.targets.sdist]
include = ["src/celine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
